version: '3.8'

services:
  teams-ae-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teams_ae_bot_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
